name: Staging preflight CI

on:
  push:
    branches:
      - preflight-security-hardening
  pull_request:
    branches:
      - feature/academic-progression-snapshot-readonly

permissions:
  contents: read

concurrency:
  group: ecasti-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Production frontend build
        run: npm run build
      - name: Isolated authorization and academic logic tests
        run: npm run test:ci
